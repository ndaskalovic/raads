[package]
name = "raads-bench"
description = "raads vs Enzyme (std::autodiff) and XAD on the same workloads"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
enzyme = [] # nightly with RUSTFLAGS="-Zautodiff=Enable"

[dependencies]
raads.workspace = true
raads-engines.workspace = true
raads-finance = { path = "../crates/raads-finance" }

[[bin]]
name = "enzyme"
required-features = ["enzyme"]
