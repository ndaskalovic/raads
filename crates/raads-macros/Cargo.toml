[package]
name = "raads-macros"
description = "#[kernel] and #[kernels] attribute macros for raads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["autodiff", "aad", "adjoint", "proc-macro"]
categories = ["mathematics", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
raads-codegen.workspace = true
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
