name: rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: aarch64, os: macos-latest, rustflags: "" }
          - { name: x86_64 baseline, os: ubuntu-latest, rustflags: "" }
          - { name: x86_64 avx2, os: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v3" }
          - { name: x86_64 avx512, os: ubuntu-latest, rustflags: "-C target-cpu=x86-64-v4", needs: avx512f }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-01 # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: check CPU support
        if: matrix.needs
        id: cpu
        run: grep -qw ${{ matrix.needs }} /proc/cpuinfo && echo ok=1 >> "$GITHUB_OUTPUT" || echo "::notice::runner lacks ${{ matrix.needs }}, skipping"
      - name: cargo test
        if: ${{ !matrix.needs || steps.cpu.outputs.ok }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-01
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
